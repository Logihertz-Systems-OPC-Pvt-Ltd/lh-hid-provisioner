[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-hid-provisioner"
version = "0.1.0"
description = "Clean-room CLI tool for compiling YAML server profiles into USB HID scripts and safety linting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Logihertz Systems OPC Pvt Ltd" }
]
keywords = ["hid", "provisioning", "duckyscript", "security", "linter", "sysadmin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "bandit>=1.7.0",
]

[project.scripts]
lh-provision = "lh_hid_provisioner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_hid_provisioner"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

